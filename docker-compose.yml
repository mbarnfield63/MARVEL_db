services:
  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro   # *.sql applied once, on empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      API_DATABASE_URL: postgresql://marvel_readonly:${MARVEL_READONLY_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data:ro   # raw published files served by /runs/{id}/files
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
