[project]
name = "db-marvel-loader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3",
    "PyYAML",
    "bibtexparser<2",
    "fastapi",
    "uvicorn",
    "psycopg-pool>=3.3.3",
]

[project.scripts]
marvel-loader = "loader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loader", "api"]
